<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>СЦБ — станция Пионерская</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#161a1e;color:#eef2f4;font-family:Arial,sans-serif}.app{min-height:100vh;display:flex;flex-direction:column}.top{height:61vh;min-height:500px;padding:12px}.screen{height:100%;background:#eeeede;border:5px solid #353a3e;border-radius:5px;position:relative;overflow:hidden}.title{position:absolute;top:10px;left:18px;color:#222;font-size:18px;font-weight:800}.diagram{position:absolute;left:10px;right:10px;top:45px;bottom:8px;width:calc(100% - 20px);height:calc(100% - 53px)}.track{fill:none;stroke:#050505;stroke-width:6;stroke-linecap:square;stroke-linejoin:miter}.section{stroke:#888;stroke-width:2;stroke-dasharray:5 5}.sectionText{fill:#666;font-size:13px;font-weight:700}.switch{fill:none;stroke:#111;stroke-width:5}.switchPos{stroke:#d4aa00}.switchHit{fill:none;stroke:transparent;stroke-width:25;cursor:pointer}.switchName{fill:#d00000;font-size:16px;font-weight:800}.signal{stroke:#111;stroke-width:3;cursor:pointer}.red{fill:#e32626}.green{fill:#16c75a}.yellow{fill:#ffd21b}.white{fill:#fff}.sigName{fill:#07833d;font-size:16px;font-weight:800}.manName{fill:#0089c0;font-size:16px;font-weight:800}.station{fill:#222;font-size:20px;font-weight:800}.side{fill:#333;font-size:15px;font-weight:800}.route{fill:none;stroke:#14bf58;stroke-width:8;opacity:.8;stroke-linecap:round}.train{fill:#2355ff;stroke:#111;stroke-width:2}.control{min-height:330px;background:#292e32;border-top:4px solid #0e1113;padding:10px 12px;display:grid;grid-template-columns:1.15fr 1fr 1fr 1.15fr;gap:10px}.panel{background:#202529;border:2px solid #454c50;border-radius:6px;padding:10px}.panel h2{font-size:13px;margin:0 0 8px}.buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.btn{border:2px solid #555;background:#343b40;color:#fff;border-radius:4px;padding:9px 5px;font-weight:800;font-size:11px;cursor:pointer}.btn.on{background:#164b2a;border-color:#21c968}.btn.warn{border-color:#e0b600}.btn.blue{border-color:#1da8db}.btn.redbtn{border-color:#d54b4b}.btn:disabled{opacity:.45;cursor:not-allowed}.status{font:11px/1.45 monospace;color:#cbd2d5;margin-top:7px;min-height:38px}.lamp{display:inline-block;width:12px;height:12px;border-radius:50%;background:#632126;border:2px solid #111;vertical-align:-2px}.lamp.on{background:#26d968;box-shadow:0 0 7px #26d968}.log{height:80px;overflow:auto;background:#111518;border:1px solid #3d4549;padding:5px;font:10px/1.4 monospace}.hint{font-size:10px;color:#929b9f;line-height:1.35;margin-top:6px}@media(max-width:950px){.top{height:600px}.control{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<section class="top"><div class="screen"><div class="title">ПУЛЬТ СЦБ · ПИОНЕРСКАЯ</div>
<svg id="diagram" class="diagram" viewBox="0 0 1200 520" preserveAspectRatio="xMidYMid meet">
<!-- Пионерская: только станционные пути. Платформ НЕТ. -->
<path class="track" d="M40 175 H1160"/>
<path class="track" d="M40 340 H1160"/>
<!-- Маневровые пути М4 и М6 -->
<path class="track" d="M500 340 L555 420 H900"/>
<path class="track" d="M500 340 L580 470 H900"/>
<!-- Блок-участки -->
<line class="section" x1="190" y1="145" x2="190" y2="205"/><line class="section" x1="430" y1="145" x2="430" y2="205"/><line class="section" x1="700" y1="145" x2="700" y2="205"/><line class="section" x1="960" y1="145" x2="960" y2="205"/>
<line class="section" x1="190" y1="310" x2="190" y2="370"/><line class="section" x1="430" y1="310" x2="430" y2="370"/><line class="section" x1="700" y1="310" x2="700" y2="370"/><line class="section" x1="960" y1="310" x2="960" y2="370"/>
<text class="sectionText" x="225" y="135">Б1</text><text class="sectionText" x="520" y="135">П1</text><text class="sectionText" x="745" y="135">Н1</text><text class="sectionText" x="1000" y="135">БН</text>
<text class="sectionText" x="225" y="400">Б2</text><text class="sectionText" x="520" y="400">П2</text><text class="sectionText" x="745" y="400">Ч2</text>
<!-- Стрелки Пионерской: только 3,4,6,8 -->
<g id="стрелка3"><path class="switch switchPos" d="M700 175 H730 L770 125"/><path class="switchHit" d="M700 175 H730 L770 125"/><text class="switchName" x="730" y="158">3</text></g>
<g id="стрелка4"><path class="switch switchPos" d="M700 340 H735 L770 340"/><path class="switchHit" d="M700 340 H735 L770 340"/><text class="switchName" x="728" y="370">4</text></g>
<g id="стрелка6"><path class="switch switchPos" d="M500 340 L555 420"/><path class="switchHit" d="M500 340 L555 420"/><text class="switchName" x="515" y="395">6</text></g>
<g id="стрелка8"><path class="switch switchPos" d="M500 340 L580 470"/><path class="switchHit" d="M500 340 L580 470"/><text class="switchName" x="545" y="455">8</text></g>
<!-- Поездные светофоры -->
<g><circle id="сигнал-Н" class="signal red" cx="430" cy="125" r="10"/><text class="sigName" x="422" y="104">Н</text></g>
<g><circle id="сигнал-Н1" class="signal red" cx="700" cy="125" r="10"/><text class="sigName" x="688" y="104">Н1</text></g>
<g><circle id="сигнал-Н2" class="signal red" cx="960" cy="125" r="10"/><text class="sigName" x="948" y="104">Н2</text></g>
<g><circle id="сигнал-Ч" class="signal red" cx="700" cy="290" r="10"/><text class="sigName" x="692" y="270">Ч</text></g>
<g><circle id="сигнал-Ч1" class="signal red" cx="770" cy="370" r="10"/><text class="sigName" x="755" y="392">Ч1</text></g>
<g><circle id="сигнал-Ч2" class="signal red" cx="770" cy="320" r="10"/><text class="sigName" x="755" y="310">Ч2</text></g>
<!-- Маневровые -->
<g><circle id="сигнал-М1" class="signal red" cx="610" cy="260" r="9"/><text class="manName" x="595" y="282">М1</text></g>
<g><circle id="сигнал-М2" class="signal red" cx="610" cy="385" r="9"/><text class="manName" x="595" y="407">М2</text></g>
<g><circle id="сигнал-М4" class="signal red" cx="555" cy="410" r="9"/><text class="manName" x="565" y="416">М4</text></g>
<g><circle id="сигнал-М6" class="signal red" cx="580" cy="460" r="9"/><text class="manName" x="590" y="466">М6</text></g>
<text class="station" x="520" y="62">СТАНЦИЯ ПИОНЕРСКАЯ</text>
<text class="side" x="42" y="110">СОСНОВЫЙ БОР</text><text class="side" x="1000" y="110">ЗАСЛОНОВА</text>
<text class="sectionText" x="45" y="505">Вход поезда с СОСНОВОГО БОРА</text><text class="sectionText" x="880" y="505">Вход поезда с ЗАСЛОНОВОЙ</text>
<path id="routeLine" class="route" d=""/>
<rect id="train" class="train" x="30" y="165" width="34" height="20" rx="3" style="display:none"/>
</svg></div></section>
<section class="control">
<div class="panel"><h2>СТРЕЛКИ ПИОНЕРСКОЙ</h2><div class="buttons" id="switches"></div><div class="hint">На станции Пионерская находятся только стрелки 3, 4, 6, 8. Стрелки 1 и 2 относятся к горловинам соседних станций.</div></div>
<div class="panel"><h2>ПОЕЗДНЫЕ СВЕТОФОРЫ</h2><div class="buttons" id="trainButtons"></div><button id="invite" class="btn warn" style="margin-top:7px;width:100%">ПРИГЛАСИТЕЛЬНЫЙ Н / Ч</button><div class="status"><span id="inviteLamp" class="lamp"></span> Пригласительный: <b id="inviteText">выкл.</b></div></div>
<div class="panel"><h2>МАНЕВРОВЫЕ</h2><div class="buttons" id="manButtons"></div><button id="manMode" class="btn blue" style="margin-top:7px;width:100%">МАНЕВРОВЫЙ РЕЖИМ</button><div class="status"><span id="manLamp" class="lamp"></span> Режим: <b id="manText">выкл.</b></div></div>
<div class="panel"><h2>ПРОПУСК ПОЕЗДОВ</h2><div class="buttons"><button class="btn on" id="fromLeft">ПУСК С СОСНОВОГО БОРА</button><button class="btn on" id="fromRight">ПУСК С ЗАСЛОНОВОЙ</button></div><div class="status" id="trainStatus">Поездов на станции нет.</div><div class="buttons" style="margin-top:6px"><button class="btn redbtn" id="release">ИСКУССТВЕННОЕ РАЗМЫКАНИЕ</button><button class="btn" id="closeAll">ЗАКРЫТЬ СИГНАЛЫ</button></div></div>
<div class="panel" style="grid-column:1/-1"><h2>ЖУРНАЛ ДСП</h2><div class="log" id="log"></div></div>
</section></div>
<script>
const arrows={3:'+',4:'+',6:'+',8:'+'};
const trainSignals=['Н','Н1','Н2','Ч','Ч1','Ч2'];
const manSignals=['М1','М2','М4','М6'];
const routes={
'Н→Н1':{from:'Н',to:'Н1',need:{}},
'Н1→Н2':{from:'Н1',to:'Н2',need:{3:'+'}},
'Ч→Ч1':{from:'Ч',to:'Ч1',need:{4:'+',3:'+'}},
'Ч→Ч2':{from:'Ч',to:'Ч2',need:{4:'-',3:'-'}}
};
let selectedRoute=null,routeActive=false,invite=false,manMode=false,train=null;
const $=id=>document.getElementById(id);
function log(t){const d=document.createElement('div');d.textContent='['+new Date().toLocaleTimeString('ru-RU')+'] '+t;$('log').prepend(d)}
function setSignal(n,state){const e=$('сигнал-'+n);e.classList.remove('red','green','yellow','white');e.classList.add(state)}
function renderSwitch(n){$('sw-'+n).textContent='СТРЕЛКА '+n+'  '+arrows[n]}
function blocked(n){return routeActive&&selectedRoute&&routes[selectedRoute].need[n]!==undefined}
Object.keys(arrows).forEach(n=>{const b=document.createElement('button');b.className='btn';b.id='sw-'+n;b.textContent='СТРЕЛКА '+n+'  +';b.onclick=()=>toggleSwitch(n);$('switches').append(b)});
document.querySelectorAll('.switchHit').forEach(e=>e.addEventListener('click',()=>toggleSwitch(e.closest('g').id.replace('стрелка',''))));
function toggleSwitch(n){if(blocked(n)){log('Стрелка '+n+' заблокирована установленным маршрутом');return}arrows[n]=arrows[n]==='+'?'-':'+';renderSwitch(n);log('Стрелка '+n+' → '+arrows[n])}
trainSignals.forEach(n=>{const b=document.createElement('button');b.className='btn';b.textContent=n;b.onclick=()=>{setSignal(n,'green');log('Поездной светофор '+n+' открыт вручную')};$('trainButtons').append(b)});
manSignals.forEach(n=>{const b=document.createElement('button');b.className='btn blue';b.textContent=n;b.onclick=()=>{if(!manMode){log('Сначала включите маневровый режим');return}setSignal(n,'green');log('Маневровый светофор '+n+' открыт')};$('manButtons').append(b)});
document.querySelectorAll('.signal').forEach(e=>e.addEventListener('click',()=>log('Сигнал выбран на пульте')));
function chooseRoute(name){selectedRoute=name;routeActive=false;$('routeLine').setAttribute('d','');log('Выбран маршрут '+name);document.querySelectorAll('[data-route]').forEach(x=>x.classList.remove('on'))}
document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>chooseRoute(b.dataset.route)));
$('invite').onclick=()=>{invite=!invite;$('inviteLamp').classList.toggle('on',invite);$('inviteText').textContent=invite?'вкл.':'выкл.';log('Пригласительный '+(invite?'включён':'выключен'))};
$('manMode').onclick=()=>{manMode=!manMode;$('manLamp').classList.toggle('on',manMode);$('manText').textContent=manMode?'вкл.':'выкл.';log('Маневровый режим '+(manMode?'включён':'выключен'))};
function openRoute(name){const r=routes[name];if(!r)return;if(name==='Ч→Ч2'&&(arrows[4]!=='-'||arrows[3]!=='-')){log('Ч → Ч2 невозможно: стрелки 4 и 3 должны быть в минусовом положении');return}for(const n in r.need){if(arrows[n]!==r.need[n]){log('Маршрут '+name+' не установлен: стрелка '+n+' должна быть '+r.need[n]);return}}selectedRoute=name;routeActive=true;setSignal(r.from,invite?'yellow':'green');$('routeLine').setAttribute('d',name==='Н→Н1'?'M430 175 H700':name==='Н1→Н2'?'M700 175 H960':name==='Ч→Ч1'?'M700 340 H770': 'M700 340 H735 L770 320');log('Маршрут '+name+' установлен'+(invite?' по пригласительному':''));invite=false;$('inviteLamp').classList.remove('on');$('inviteText').textContent='выкл.'}
const routePanel=document.querySelector('.panel:nth-child(4)');['Н→Н1','Н1→Н2','Ч→Ч1','Ч→Ч2'].forEach(n=>{const b=document.createElement('button');b.className='btn';b.textContent='УСТАНОВИТЬ '+n;b.onclick=()=>openRoute(n);routePanel.querySelector('.buttons').prepend(b)});
function startTrain(side){if(train){log('На станции уже находится поезд');return}const right=side==='right';train={side,right,progress:0};$('train').style.display='block';$('train').setAttribute('x',right?'1130':'30');$('train').setAttribute('y',''+(right?330:165));$('trainStatus').textContent='Поезд следует с '+(right?'Заслоновой':'Соснового Бора');log('Поезд отправлен со станции '+(right?'Заслонова':'Сосновый Бор'));animateTrain()}
function animateTrain(){if(!train)return;train.progress+=0.012;const p=train.progress,right=train.right;let x=right?1130-1080*p:30+1080*p;$('train').setAttribute('x',x);if(p>=1){$('train').style.display='none';$('trainStatus').textContent='Поезд прибыл на станцию Пионерская и остановлен.';log('Поезд прибыл на Пионерскую');train=null;return}requestAnimationFrame(animateTrain)}
$('fromLeft').onclick=()=>startTrain('left');$('fromRight').onclick=()=>startTrain('right');
$('release').onclick=()=>{routeActive=false;selectedRoute=null;$('routeLine').setAttribute('d','');log('Выполнено искусственное размыкание маршрута')};
$('closeAll').onclick=()=>{trainSignals.forEach(n=>setSignal(n,'red'));manSignals.forEach(n=>setSignal(n,'red'));routeActive=false;selectedRoute=null;$('routeLine').setAttribute('d','');log('Все сигналы закрыты')};
log('Схема Пионерской загружена: платформ нет, стрелки станции 3/4/6/8, вход поездов с обеих сторон.');
</script></body></html>
