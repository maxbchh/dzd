<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Симулятор ДСП — Пионерская</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#15191e;color:#eef2f5;font-family:Arial,sans-serif;overflow:hidden}header{height:58px;background:#0b0f13;border-bottom:1px solid #3b444d;display:flex;align-items:center;justify-content:space-between;padding:0 18px}h1{margin:0;font-size:19px}.sub{font-size:12px;color:#9da7b1;margin-top:3px}.clock{font:700 18px monospace}main{height:calc(100vh - 58px);display:grid;grid-template-columns:minmax(800px,1fr) 350px;gap:10px;padding:10px}.board{background:#f8f8f3;border:5px solid #343a40;border-radius:6px;overflow:hidden;min-width:0}svg{width:100%;height:100%;display:block;background:#f8f8f3}.track{fill:none;stroke:#050505;stroke-width:6;stroke-linecap:square;stroke-linejoin:miter}.platform{fill:#3455f5}.platformText{fill:#2540bd;font-size:15px;font-weight:700}.name{fill:#111;font-size:18px;font-weight:800}.small{fill:#777;font-size:13px;font-weight:700}.switch{fill:none;stroke:#111;stroke-width:5;stroke-linecap:square}.yellow{stroke:#d7aa00}.switchText{fill:#d00000;font-size:16px;font-weight:800}.sig{stroke:#111;stroke-width:3;cursor:pointer}.red{fill:#e3262e}.green{fill:#19c95b}.blue{fill:#19a9df}.yellowLight{fill:#ffd21b}.sigText{fill:#07823a;font-size:16px;font-weight:800}.manText{fill:#0088bd;font-size:16px;font-weight:800}.section{stroke:#777;stroke-width:2;stroke-dasharray:5 5}.route{fill:none;stroke:#f1a900;stroke-width:10;opacity:.65;stroke-linecap:round}.route.active{stroke:#19bd57}.hit{fill:none;stroke:transparent;stroke-width:24;cursor:pointer}.panel{background:#1c232a;border:1px solid #3a4650;border-radius:8px;padding:11px}.sidebar{display:flex;flex-direction:column;gap:9px;overflow:auto}.panel h2{font-size:14px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.btn{background:#27313a;border:1px solid #48545f;color:#f4f6f7;border-radius:5px;padding:8px 5px;font-weight:700;cursor:pointer}.btn.active{outline:2px solid #22baff}.btn.good{border-color:#1d9150}.btn.danger{border-color:#ad3e3e}.hint{color:#9ca8b3;font-size:12px;line-height:1.4}.log{height:135px;background:#0d1217;border-radius:5px;overflow:auto;padding:6px;font:11px/1.4 monospace}.routeList{display:flex;flex-direction:column;gap:4px}.routeRow{background:#11171c;border:1px solid #303a43;border-radius:4px;padding:6px;font-size:11px}@media(max-width:1000px){body{overflow:auto}main{height:auto;grid-template-columns:1fr}.board{height:650px}}
</style>
</head>
<body>
<header><div><h1>Симулятор ДСП — станция Пионерская</h1><div class="sub">Сословобор ← Пионерская → Заслонова</div></div><div id="clock" class="clock"></div></header>
<main>
<section class="board">
<svg id="scheme" viewBox="0 0 1200 650" preserveAspectRatio="xMidYMid meet">
<!-- НАЗВАНИЯ -->
<text class="name" x="55" y="65">СОСЛОВОБОР</text><text class="name" x="525" y="65">ПИОНЕРСКАЯ</text><text class="name" x="1020" y="65">ЗАСЛОНОВА</text>
<!-- РОВНЫЕ ПУТИ -->
<path class="track" d="M65 270 H1080"/>
<path class="track" d="M65 390 H420 L475 335 H790 L845 390 H1080"/>
<!-- МАНЕВРОВЫЕ ПУТИ M4 / M6 -->
<path class="track" d="M475 335 L525 485 H850"/>
<path class="track" d="M475 335 L545 550 H850"/>
<!-- ЛЕВАЯ ГОРЛОВИНА -->
<path class="track" d="M65 270 L30 235 L30 155 L80 115 L145 115 L180 155 L180 220"/>
<!-- ПРАВАЯ ГОРЛОВИНА -->
<path class="track" d="M1080 270 L1125 225 L1125 135 L1080 95 L1015 95 L980 135 L980 270"/>
<!-- ПЛАТФОРМЫ -->
<rect class="platform" x="430" y="280" width="365" height="13" rx="2"/><rect class="platform" x="430" y="402" width="365" height="13" rx="2"/>
<text class="platformText" x="570" y="308">ПЛАТФОРМА 1</text><text class="platformText" x="570" y="438">ПЛАТФОРМА 2</text>
<!-- БЛОК-УЧАСТКИ -->
<line class="section" x1="260" y1="250" x2="260" y2="290"/><line class="section" x1="430" y1="250" x2="430" y2="290"/><line class="section" x1="650" y1="250" x2="650" y2="290"/><line class="section" x1="845" y1="250" x2="845" y2="290"/><line class="section" x1="260" y1="370" x2="260" y2="410"/><line class="section" x1="650" y1="370" x2="650" y2="410"/><line class="section" x1="845" y1="370" x2="845" y2="410"/>
<text class="small" x="285" y="238">Б1</text><text class="small" x="500" y="238">П1</text><text class="small" x="690" y="238">Н1</text><text class="small" x="900" y="238">ЗН</text><text class="small" x="285" y="438">Б2</text><text class="small" x="515" y="438">П2</text><text class="small" x="690" y="438">С2</text>
<!-- СТРЕЛКИ -->
<g id="s1"><path class="switch yellow" d="M180 270 H220 L255 320"/><path class="hit" d="M180 270 H220 L255 320"/><text class="switchText" x="210" y="315">1</text></g>
<g id="s2"><path class="switch yellow" d="M420 270 H455 L490 335"/><path class="hit" d="M420 270 H455 L490 335"/><text class="switchText" x="440" y="315">2</text></g>
<g id="s3"><path class="switch yellow" d="M790 270 H820 L845 220"/><path class="hit" d="M790 270 H820 L845 220"/><text class="switchText" x="805" y="250">3</text></g>
<g id="s4"><path class="switch yellow" d="M790 390 H825 L845 390"/><path class="hit" d="M790 390 H825 L845 390"/><text class="switchText" x="808" y="425">4</text></g>
<g id="s6"><path class="switch yellow" d="M475 335 L525 485"/><path class="hit" d="M475 335 L525 485"/><text class="switchText" x="490" y="455">6</text></g>
<g id="s8"><path class="switch yellow" d="M475 335 L545 550"/><path class="hit" d="M475 335 L545 550"/><text class="switchText" x="510" y="530">8</text></g>
<!-- ПОЕЗДНЫЕ СВЕТОФОРЫ: ТОЛЬКО РУССКИЕ ОБОЗНАЧЕНИЯ -->
<g class="signal" data-sig="Н"><circle id="Н" class="sig red" cx="420" cy="225" r="10"/><text class="sigText" x="411" y="205">Н</text></g>
<g class="signal" data-sig="Н1"><circle id="Н1" class="sig red" cx="790" cy="225" r="10"/><text class="sigText" x="778" y="205">Н1</text></g>
<g class="signal" data-sig="НС"><circle id="НС" class="sig red" cx="845" cy="185" r="10"/><text class="sigText" x="832" y="165">НС</text></g>
<g class="signal" data-sig="ЧС"><circle id="ЧС" class="sig red" cx="420" cy="350" r="10"/><text class="sigText" x="406" y="330">ЧС</text></g>
<g class="signal" data-sig="Ч"><circle id="Ч" class="sig red" cx="790" cy="350" r="10"/><text class="sigText" x="785" y="330">Ч</text></g>
<g class="signal" data-sig="Ч1"><circle id="Ч1" class="sig red" cx="845" cy="370" r="10"/><text class="sigText" x="835" y="350">Ч1</text></g>
<g class="signal" data-sig="Ч2"><circle id="Ч2" class="sig red" cx="845" cy="425" r="10"/><text class="sigText" x="835" y="450">Ч2</text></g>
<g class="signal" data-sig="ЧЗ"><circle id="ЧЗ" class="sig red" cx="980" cy="390" r="10"/><text class="sigText" x="965" y="370">ЧЗ</text></g>
<g class="signal" data-sig="НЗ"><circle id="НЗ" class="sig red" cx="980" cy="270" r="10"/><text class="sigText" x="965" y="250">НЗ</text></g>
<!-- МАНЕВРОВЫЕ СВЕТОФОРЫ -->
<g class="signal" data-sig="М1"><circle id="М1" class="sig blue" cx="680" cy="320" r="9"/><text class="manText" x="667" y="345">М1</text></g>
<g class="signal" data-sig="М2"><circle id="М2" class="sig blue" cx="680" cy="390" r="9"/><text class="manText" x="667" y="415">М2</text></g>
<g class="signal" data-sig="М4"><circle id="М4" class="sig blue" cx="525" cy="475" r="9"/><text class="manText" x="535" y="480">М4</text></g>
<g class="signal" data-sig="М6"><circle id="М6" class="sig blue" cx="545" cy="540" r="9"/><text class="manText" x="555" y="545">М6</text></g>
<text class="name" x="690" y="490" font-size="15">МАНЕВРОВЫЕ ПУТИ</text><text class="small" x="690" y="510">М4 / М6 · АНГАР</text>
<path id="route" class="route" d=""/>
</svg>
</section>
<aside class="sidebar">
<div class="panel"><h2>Стрелки</h2><div id="switchButtons" class="grid"></div><div class="hint">Перевод + / −. Стрелка блокируется при установленном маршруте.</div></div>
<div class="panel"><h2>Маршруты</h2><div class="grid" id="routes"><button class="btn" data-r="Н-Н1">Н → Н1</button><button class="btn" data-r="Н1-НС">Н1 → НС</button><button class="btn" data-r="НС-ЧС">НС → ЧС</button><button class="btn" data-r="Ч-Ч1">Ч → Ч1</button><button class="btn" data-r="Ч-Ч2">Ч → Ч2</button><button class="btn" data-r="Ч1-ЧЗ">Ч1 → ЧЗ</button><button class="btn" data-r="ЧЗ-НЗ">ЧЗ → НЗ</button><button class="btn" data-r="НЗ-Н">НЗ → Н</button></div><div style="display:flex;gap:6px;margin-top:7px"><button id="install" class="btn good">Установить</button><button id="cancel" class="btn danger">Отмена</button></div><div class="hint" style="margin-top:7px">Маршрут Ч → Ч2 требует стрелки 4 и 3 в положении −.</div></div>
<div class="panel"><h2>Светофоры</h2><div id="signalButtons" class="grid"></div><div style="display:flex;gap:6px;margin-top:7px"><button id="invite" class="btn">Пригласительный</button><button id="close" class="btn danger">Закрыть</button></div></div>
<div class="panel"><h2>Установленные маршруты</h2><div id="routeList" class="routeList"><div class="hint">Нет маршрутов</div></div></div>
<div class="panel"><h2>Журнал ДСП</h2><div id="log" class="log"></div></div>
</aside>
</main>
<script>
const arrows={1:'+',2:'+',3:'+',4:'+',6:'+',8:'+'};
const signalNames=['Н','Н1','НС','ЧС','Ч','Ч1','Ч2','ЧЗ','НЗ','М1','М2','М4','М6'];
const trainSignals=['Н','Н1','НС','ЧС','Ч','Ч1','Ч2','ЧЗ','НЗ'];
const manSignals=['М1','М2','М4','М6'];
const routes={
'Н-Н1':{from:'Н',to:'Н1',need:{},d:'M420 270 H790'},
'Н1-НС':{from:'Н1',to:'НС',need:{3:'+'},d:'M790 270 H820 L845 220'},
'НС-ЧС':{from:'НС',to:'ЧС',need:{2:'+'},d:'M845 220 L790 270 H420'},
'Ч-Ч1':{from:'Ч',to:'Ч1',need:{4:'+',3:'+'},d:'M790 390 H845'},
'Ч-Ч2':{from:'Ч',to:'Ч2',need:{4:'-',3:'-'},d:'M790 390 H825 L845 425'},
'Ч1-ЧЗ':{from:'Ч1',to:'ЧЗ',need:{4:'+'},d:'M845 390 H980'},
'ЧЗ-НЗ':{from:'ЧЗ',to:'НЗ',need:{3:'+'},d:'M980 390 V270'},
'НЗ-Н':{from:'НЗ',to:'Н',need:{},d:'M980 270 H790 H420'}
};
let selected=null,inv=false,activeRoutes=[];
const $=x=>document.querySelector(x),$$=x=>[...document.querySelectorAll(x)];
function log(t){const e=document.createElement('div');e.textContent='['+new Date().toLocaleTimeString('ru-RU')+'] '+t;$('#log').prepend(e)}
function renderArrow(n){$('#a'+n).textContent=n+': '+arrows[n]}
function renderSignal(n,state){const e=document.getElementById(n);if(!e)return;e.classList.remove('red','green','yellowLight');e.classList.add(state||'red')}
Object.keys(arrows).forEach(n=>{const b=document.createElement('button');b.id='a'+n;b.className='btn';b.textContent=n+': +';b.onclick=()=>toggleArrow(n);$('#switchButtons').append(b)});
function blocked(n){return activeRoutes.some(r=>Object.prototype.hasOwnProperty.call(r.need,n))}
function toggleArrow(n){if(blocked(n))return log('Стрелка '+n+' заблокирована маршрутом');arrows[n]=arrows[n]=='+'?'-':'+';renderArrow(n);log('Стрелка '+n+' переведена в '+arrows[n])}
$$('.hit').forEach(h=>h.onclick=()=>toggleArrow(h.closest('g').id.substring(1)));
signalNames.forEach(n=>{const b=document.createElement('button');b.className='btn';b.textContent=n;b.onclick=()=>{if(manSignals.includes(n))return log('Маневровый светофор '+n+' управляется отдельно');renderSignal(n,$('#'+n).classList.contains('green')?'red':'green');log('Светофор '+n+' '+($('#'+n).classList.contains('green')?'открыт':'закрыт'))};$('#signalButtons').append(b)});
$$('.signal').forEach(g=>g.onclick=()=>{const n=g.dataset.sig;if(manSignals.includes(n))return log('Маневровый светофор '+n+' не зависит от поездного');renderSignal(n,$('#'+n).classList.contains('green')?'red':'green')});
$$('[data-r]').forEach(b=>b.onclick=()=>{selected=b.dataset.r;$$('[data-r]').forEach(x=>x.classList.toggle('active',x===b));log('Выбран маршрут '+routes[selected].from+' → '+routes[selected].to)});
$('#install').onclick=()=>{if(!selected)return log('Маршрут не выбран');const r=routes[selected];for(const n in r.need){if(arrows[n]!==r.need[n]){log('Маршрут не установлен: стрелка '+n+' должна быть '+r.need[n]);return}};activeRoutes.push(r);for(const n in r.need){arrows[n]=r.need[n];renderArrow(n)}renderSignal(r.from,inv?'yellowLight':'green');$('#route').setAttribute('d',r.d);$('#route').classList.add('active');const row=document.createElement('div');row.className='routeRow';row.textContent=r.from+' → '+r.to+(inv?' · пригласительный':'');$('#routeList').innerHTML='';$('#routeList').append(row);log('Маршрут '+r.from+' → '+r.to+' установлен');selected=null;inv=false;$$('[data-r]').forEach(x=>x.classList.remove('active'))};
function closeAll(){activeRoutes=[];trainSignals.forEach(n=>renderSignal(n,'red'));$('#route').setAttribute('d','');$('#route').classList.remove('active');$('#routeList').innerHTML='<div class="hint">Нет маршрутов</div>';log('Маршруты сняты, поездные светофоры закрыты')}
$('#cancel').onclick=closeAll;$('#close').onclick=closeAll;$('#invite').onclick=()=>{inv=!inv;$('#invite').classList.toggle('active',inv);log('Пригласительный '+(inv?'включён':'выключен'))};
function tick(){$('#clock').textContent=new Date().toLocaleTimeString('ru-RU')}setInterval(tick,1000);tick();log('Загружена ровная схема станции Пионерская. Все обозначения светофоров — на русском.');
</script>
</body>
</html>
